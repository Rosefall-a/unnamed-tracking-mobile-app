name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - run: gradle -p src/androidapp testDebugUnitTest lintDebug --no-daemon
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Test Windows core
        run: dotnet test src/windowsapp/Tracking.Windows.Tests/Tracking.Windows.Tests.csproj --configuration Release
      - name: Build Windows x64
        run: dotnet build src/windowsapp/Tracking.Windows/Tracking.Windows.csproj --configuration Release -p:Platform=x64
      - name: Publish self-contained Windows x64
        run: dotnet publish src/windowsapp/Tracking.Windows/Tracking.Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -o artifacts/windows
      - name: Verify Windows publish
        shell: pwsh
        run: |
          if (-not (Test-Path 'artifacts/windows/Tracking.Windows.exe')) { throw 'Windows executable was not produced.' }
          if (-not (Test-Path 'artifacts/windows/Microsoft.WindowsAppRuntime.1.6')) { throw 'Windows App SDK self-contained runtime was not included.' }
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert secure client transport
        run: |
          ! rg 'usesCleartextTraffic="true"' src/androidapp --glob 'AndroidManifest.xml'
          test "$(rg -l 'require\\(uri.scheme == "https"\\)' src/androidapp --glob 'ServerUrl.kt' | wc -l)" -eq 2
          rg 'uri.scheme == "http"' src/androidapp/webapp/src/main/java/com/rosefall/tracker/webapp/MainActivity.kt
          ! rg 'isPasswordAutosaveEnabled = true' src
          ! rg 'println\(.*password|Log\..*password|Message.*password' src
          rg '<WindowsAppSDKSelfContained>true</WindowsAppSDKSelfContained>' src/windowsapp/Tracking.Windows/Tracking.Windows.csproj
      - name: Validate PWA JSON
        run: jq empty pwa/manifest.webmanifest
