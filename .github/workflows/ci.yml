name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - run: gradle -p src/androidapp testDebugUnitTest lintDebug --no-daemon
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - run: dotnet test src/windowsapp/Tracking.Windows.Tests/Tracking.Windows.Tests.csproj --configuration Release
      - run: dotnet build src/windowsapp/Tracking.Windows/Tracking.Windows.csproj --configuration Release -p:Platform=x64
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert secure client transport
        run: |
          ! rg 'http://|isPasswordAutosaveEnabled = true' src --glob '*.kt' --glob '*.cs' --glob '!**/test/**' --glob '!**/*Tests/**'
          ! rg 'println\(.*password|Log\..*password|Message.*password' src
      - name: Validate PWA JSON
        run: jq empty pwa/manifest.webmanifest
